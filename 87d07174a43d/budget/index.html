<title>Budget</title>
<style>
:root{--bg:#0F1B2D;--card:#14213D;--card2:#1C2C4D;--mint:#3DDC97;--teal:#5EEAD4;--coral:#FF6B6B;--text:#F4F1EA;--muted:#8FA0BA;--track:#2B3B5C;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.muted{color:var(--muted)} .mint{color:var(--mint)} .coral{color:var(--coral)} .teal{color:var(--teal)}
#main{padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 110px);display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.hdr .sub{font-size:13px;color:var(--muted)} .hdr .t{font-size:28px;font-weight:700;display:flex;align-items:center;gap:6px}
.icb{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.card{background:var(--card);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.pt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:30px;font-weight:700;letter-spacing:-.01em} .mid{font-size:22px;font-weight:700}
.bline{display:flex;align-items:center;gap:10px}
.track{flex:1;background:var(--track);border-radius:99px;overflow:hidden;height:10px}
.fill{height:100%;border-radius:99px;background:var(--mint)}
.tag{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:99px;min-width:50px;text-align:center;background:#3DDC9722;color:var(--mint)}
.tag.over,.fill.over{background:#FF6B6B22;color:var(--coral)} .fill.over{background:var(--coral)}
.pill{font-size:11px;font-weight:600;border:1px solid #8FA0BA66;color:var(--muted);border-radius:99px;padding:2px 8px;letter-spacing:.04em;white-space:nowrap}
.pill.teal{border-color:#5EEAD466;color:var(--teal)} .pill.coral{border-color:#FF6B6B66;color:var(--coral)} .pill.mint{border-color:#3DDC9766;color:var(--mint)}
.ring{position:relative;flex:none} .ring svg{display:block}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rsub{font-size:12px;color:var(--muted);margin-top:2px}
.chip{background:var(--card2);border-radius:14px;padding:10px 12px} .chip .l{font-size:12px;color:var(--muted)} .chip .v{font-size:17px;font-weight:700;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;width:100%;background:var(--mint);color:var(--bg);font-weight:700;border-radius:14px;padding:15px;text-align:center;font-size:16px;min-height:50px}
.btn.ghost{background:transparent;color:var(--mint);border:2px solid var(--mint)}
.btn.sec{background:var(--card2);color:var(--text)} .btn.danger{background:transparent;color:var(--coral);border:2px solid #FF6B6B88}
.check{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none;border:2px solid var(--track)}
.check.on{background:var(--mint);color:var(--bg);border-color:var(--mint)}
.li{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid #2B3B5C88;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.small{font-size:12.5px} .tiny{font-size:11.5px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--track);display:flex;justify-content:space-around;padding:8px 6px calc(var(--sb) + 8px);z-index:20}
.tab{width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600;min-height:48px}
.tab svg{width:26px;height:26px} .tab.on{color:var(--mint)}
.fab{width:62px;height:62px;border-radius:50%;background:var(--mint);color:var(--bg);font-size:36px;font-weight:400;display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:0 6px 18px #0009,0 0 0 5px var(--bg);line-height:1}
.sheetwrap{position:fixed;inset:0;background:#000A;z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheetwrap.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(var(--sb) + 22px);display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--track);margin:0 auto 4px;flex:none}
.sh-t{display:flex;justify-content:space-between;align-items:center} .sh-t b{font-size:21px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.inp{background:var(--bg);border:1px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px;min-height:50px;width:100%;color:var(--text);outline:none}
.inp:focus{border-color:var(--mint)} .inp.amt{font-size:32px;font-weight:700;padding:10px 14px}
textarea.inp{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
select.inp{appearance:none;-webkit-appearance:none}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:5px;gap:4px}
.seg button{flex:1;padding:12px 2px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);min-height:44px}
.seg button.on{background:var(--mint);color:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 104px);background:var(--card2);border:1px solid var(--mint);color:var(--text);padding:12px 16px;border-radius:14px;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px #0008}
.info{background:#5EEAD412;border:1px solid #5EEAD444;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.45}
.warn{background:#FF6B6B14;border:1px solid #FF6B6B55;border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.4}
#setup{max-width:560px;margin:0 auto;padding:calc(var(--st) + 40px) 20px 40px;display:none;flex-direction:column;gap:14px}
.hidden{display:none!important}
</style>
</head>

<script>
(function(){
"use strict";
const KEY = 'budgetTracker.v1';
// Generic defaults only. Real data comes from the private setup file.
const DEFAULT_WORK = ['UBER', 'LYFT'];
let S = load();
let ui = { tab: 'home', month: null, add: null, csv: null };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
function money(n, d) { d = d == null ? 2 : d; const v = Math.abs(+n || 0).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d}); return (n < -0.004 ? '−$' : '$') + v; }
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
function now() { return new Date(); }
function pad(n) { return String(n).padStart(2, '0'); }
function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function curYM() { const d = now(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function ymAdd(ym, k) { let [y, m] = ym.split('-').map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad(m); }
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function mLabel(ym, short) { const [y, m] = ym.split('-').map(Number); const n = MN[m - 1]; return short ? n.slice(0, 3) + ' ' + y : n + ' ' + y; }
function daysIn(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function ord(d) { return d + (d % 10 == 1 && d != 11 ? 'st' : d % 10 == 2 && d != 12 ? 'nd' : d % 10 == 3 && d != 13 ? 'rd' : 'th'); }
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function toast(msg, ms) { const t = $('#toast'); t.innerHTML = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 2600); }

// ---------------- setup / state ----------------
function newState(setup) {
  const st = { setup: setup, tx: [], payments: [], billActual: {}, billOverride: {}, debtBase: {}, goalPaid: {}, savings: {}, notes: {}, focusDone: [], created: isoDate(now()) };
  (setup.bills || []).forEach(b => { if (b.actual) Object.keys(b.actual).forEach(ym => st.billActual[ym + '|' + b.id] = b.actual[ym]); });
  (setup.savings || []).forEach(s => st.savings[s.id] = s.balance);
  return st;
}
function acceptJSON(txt) {
  let j; try { j = JSON.parse(txt); } catch (e) { return err('That is not valid JSON.'); }
  if (j && j.type === 'budget-backup' && j.state && j.state.setup) { S = j.state; }
  else if (j && j.type === 'budget-setup' && Array.isArray(j.bills) && Array.isArray(j.debts) && j.personal) {
    if (S && S.setup && !confirm('Replace the current setup? Logged spending is kept.')) return;
    const old = S; S = newState(j);
    if (old) { S.tx = old.tx || []; S.payments = old.payments || []; S.billOverride = old.billOverride || {}; S.goalPaid = old.goalPaid || {}; Object.assign(S.billActual, old.billActual || {}); }
  } else return err('This file is not a budget setup or backup file.');
  save(); ui.month = null; start(); toast('Setup loaded ✓');
  function err(m) { const e = $('#setupErr'); e.textContent = m; e.classList.remove('hidden'); }
}
$('#setupFile').addEventListener('change', ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(acceptJSON); ev.target.value = ''; });

// ---------------- computations ----------------
const setup = () => S.setup;
function billActive(b, ym) { return (!b.from || ym >= b.from) && (!b.until || ym <= b.until); }
function billsFor(ym) { return setup().bills.filter(b => billActive(b, ym)).slice().sort((a, b) => a.day - b.day || 0); }
function billAmt(b, ym) { const k = ym + '|' + b.id; return k in S.billActual ? S.billActual[k] : b.amount; }
function billPaid(b, ym) {
  const k = ym + '|' + b.id; if (k in S.billOverride) return S.billOverride[k];
  const c = curYM(); if (ym < c) return true; if (ym > c) return false;
  return now().getDate() >= Math.min(b.day, daysIn(ym));
}
function txFor(ym) { return S.tx.filter(t => t.date.slice(0, 7) === ym); }
function personal(ym) {
  const cats = setup().personal.categories.map(c => Object.assign({}, c, { spent: 0 }));
  const by = {}; cats.forEach(c => by[c.id] = c);
  let spent = 0, work = 0, extraFixed = 0;
  txFor(ym).forEach(t => {
    if (t.kind === 'work') work += t.amount;
    else if (t.kind === 'fixed') extraFixed += t.amount;
    else { spent += t.amount; (by[t.cat] || by[setup().rules && setup().rules.defaultCategory] || cats[cats.length - 1]).spent += t.amount; }
  });

  const segs = base.segs ? Object.assign({}, base.segs) : null;

    for (let ym = ymAdd(base.asOf.slice(0, 7), 0); ym <= curYM(); ym = ymAdd(ym, 1)) {

    case 'delTx': if (confirm('Delete this entry?')) { S.tx = S.tx.filter(t => t.id !== id); save(); closeSheet(); render(); } break;
    case 'bill': sheetBill(id); break;
    case 'saveBill': { const v = r2(parseFloat(($('#bAmt').value || '').replace(/[$,]/g, ''))); S.billActual[ym + '|' + id] = v; save(); closeSheet(); render(); checkFocusAdvance(); toast('Saved ✓'); break; }
    case 'billPaid': S.billOverride[ym + '|' + id] = el.dataset.v === '1'; save(); closeSheet(); render(); checkFocusAdvance(); break;
    case 'billReset': delete S.billOverride[ym + '|' + id]; delete S.billActual[ym + '|' + id]; save(); closeSheet(); render(); break;
    case 'pay': sheetPay(id); break;
    case 'savePay': { const v = r2(parseFloat(($('#pAmt').value || '').replace(/[$,]/g, ''))); if (!v) { toast('Enter an amount'); return; }
      S.payments.push({ id: uid(), debtId: id, seg: $('#pSeg') ? $('#pSeg').value : null, amount: v, date: $('#pDate').value || isoDate(now()), note: $('#pNote').value.trim() });
      save(); closeSheet(); render(); toast('Payment logged ✓'); checkFocusAdvance(); break; }
    case 'delPay': S.payments = S.payments.filter(p => p.id !== id); save(); sheetPay(el.closest('.sheet').querySelector('[data-act=savePay]').dataset.id); render(); break;
    case 'statement': sheetStatement(); break;
    case 'saveStmt': { const t = isoDate(now()), nb = {};
      document.querySelectorAll('[data-stmt]').forEach(i => { const d = i.dataset.stmt, v = r2(parseFloat(i.value.replace(/[$,]/g, ''))); nb[d] = nb[d] || { asOf: t, balance: 0, segs: null }; if (i.dataset.seg) { nb[d].segs = nb[d].segs || {}; nb[d].segs[i.dataset.seg] = v; } else nb[d].balance = v; });
      Object.assign(S.debtBase, nb); save(); closeSheet(); render(); checkFocusAdvance(); toast('Balances updated ✓'); break; }
    case 'menu': sheetMenu(); break;
    case 'month': ui.month = el.dataset.ym === curYM() ? null : el.dataset.ym; closeSheet(); render(); break;
    case 'export': doExport(); break;
    case 'share': share(); break;
    case 'dl': { const x = window.__lastExport; download(x.csvName, x.csv, 'text/csv'); setTimeout(() => download(x.txtName, x.txt, 'text/plain'), 400); break; }
    case 'csv': sheetCSV(); break;
    case 'csvParse': csvPreview(); break;
    case 'csvSave': csvSave(); break;
    case 'goal': { const k = el.dataset.ym + '|' + id; S.goalPaid[k] = !S.goalPaid[k]; save(); render(); break; }
    case 'toggleBreak': S.hideBreak = !S.hideBreak; save(); render(); break;
    case 'savings': sheetSavings(); break;
    case 'saveSav': document.querySelectorAll('[data-sav]').forEach(i => S.savings[i.dataset.sav] = r2(parseFloat(i.value.replace(/[$,]/g, '')))); save(); closeSheet(); render(); break;
    case 'backup': backup(); break;
    case 'reset': if (confirm('Erase all budget data on this phone? Export a backup first if you want to keep it.')) { localStorage.removeItem(KEY); S = null; closeSheet(); start(); } break;
  }
});
function start() {
  const ok = !!(S && S.setup);
  $('#setup').style.display = ok ? 'none' : 'flex';
  $('#main').classList.toggle('hidden', !ok); $('#tabs').classList.toggle('hidden', !ok);
  if (ok) { render(); checkFocusAdvance(); }
}
window.__budget = { get state() { return S; }, buildExport, render };
start();
})();
</script>
</body>
