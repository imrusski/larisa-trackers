<title>Larisa · 30-day plan · PDR draft v1</title><style>:root{--ink:#22243a;--muted:#6b6f85;--bg:#f6f5fb;--card:#fff;--line:#e8e7f0;--acc:#6c63ff;
--str:#ff6b5b;--skl:#8b5cf6;--run:#14b8a6;--rest:#22c55e;--r:18px;
--men:#f43f5e;--fol:#14b8a6;--ovu:#f59e0b;--lut:#8b5cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(86px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 8px}
.brand{font-weight:800;font-size:15px}.ver{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#fff3c4;color:#7a5a00;border:1px dashed #e0b84a;border-radius:999px;padding:2px 8px}
.hero{background:linear-gradient(135deg,#6c63ff 0%,#a855f7 55%,#ff6b8b 100%);color:#fff;border-radius:22px;padding:14px 14px 12px;margin-bottom:10px}
.datenav{display:flex;align-items:center;gap:8px}
.datenav button{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:12px;width:38px;height:38px;font-size:20px;font-weight:700}
.datenav .dlabel{flex:1;text-align:center}.dlabel b{display:block;font-size:19px;line-height:1.2}.dlabel span{font-size:13px;opacity:.95}
.datenav .todaybtn{width:auto;padding:0 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.hero .chips span{background:rgba(255,255,255,.2);border-radius:10px;padding:3px 8px;font-size:12px;font-weight:700}
.hero .chips .ph{background:#fff;color:var(--pc)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(30,30,60,.05),0 6px 20px rgba(30,30,60,.05);border:1px solid var(--line)}
.card h3{margin:0 0 4px;font-size:18px}.muted{color:var(--muted)}.small{font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--pc,var(--acc));padding:3px 9px;border-radius:999px}
.t-str{--pc:var(--str)}.t-skl{--pc:var(--skl)}.t-run{--pc:var(--run)}.t-rest{--pc:var(--rest)}
.p-men{--pc:var(--men)}.p-fol{--pc:var(--fol)}.p-ovu{--pc:var(--ovu)}.p-lut{--pc:var(--lut)}
.banner{border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px;border:1px solid}
.banner b{display:block;font-size:13px;margin-bottom:1px}
.b-warn{background:#fff4ef;border-color:#ffd2c2;color:#7c2d12}.b-info{background:#eef0ff;border-color:#d7dbff;color:#312e81}
.b-good{background:#eefaf3;border-color:#c7ecd5;color:#14532d}.b-red{background:#fff0f0;border-color:#fecaca;color:#7f1d1d}
.wk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:12px}
.meter b{font-size:15px}.bar{height:7px;background:#efeef6;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.shead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:#f3f2fa;border-radius:12px;padding:6px 10px;white-space:nowrap}
.toggle input{width:18px;height:18px;accent-color:var(--acc)}
.block{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.bhead{display:flex;justify-content:space-between;align-items:baseline}.bhead h4{margin:0;font-size:15px}.mins{font-size:12px;font-weight:700;color:var(--muted)}
.block.skill h4{color:var(--skl)}.block.main h4{color:var(--str)}.block.plyo h4{color:#0e7490}
.ex{background:#fafafe;border-radius:14px;padding:10px;margin-top:8px;border:1px solid #f0eff7}
.ex.done{background:#f1fbf5;border-color:#cdeed9}
.exrow{display:flex;gap:8px;align-items:flex-start}
.exname{font-weight:700;font-size:15px;flex:1}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:#eef0ff;color:#3f3aa8;white-space:nowrap}
.c-rest{background:#eaf7f4;color:#0f766e}.c-rpe{background:#fff0ec;color:#c2410c}.c-load{background:#f3efff;color:#5b21b6}
.c-up{background:#dcfce7;color:#166534}.c-hold{background:#fef3c7;color:#92400e}.c-save{background:#fde7f3;color:#9d174d}
.exnote{font-size:13px;color:var(--muted);margin-top:4px}
.swap{font-size:13px;margin-top:6px;background:#fff4ef;color:#7c2d12;border-radius:10px;padding:6px 8px}
details.how{margin-top:6px}details.how summary{font-size:13px;font-weight:700;color:var(--acc);cursor:pointer;list-style:none}
details.how summary::-webkit-details-marker{display:none}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin:6px 0}.fig svg{width:100%;height:auto;display:block;max-height:220px}
.feel{background:#eefaf6;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}
.k{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.feel .k{color:#0f766e}.kv{font-size:13px;margin:4px 0}
.var{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}.var>div{border-radius:10px;padding:6px 8px}.easy{background:#effaf0}.hard{background:#f3efff}
.sets{display:grid;gap:6px;margin-top:8px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:6px;align-items:center}
.set.two{grid-template-columns:22px 1fr 44px}
.set .n{font-size:12px;font-weight:800;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 8px;font-size:16px;background:#fff}
.set label{position:relative;display:block}.set label small{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.ck{height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:18px;font-weight:800;color:#c4c6d6}
.ck.on{background:#22c55e;border-color:#22c55e;color:#fff}
.donebtn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.rpeline{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.rpeline select{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:16px;background:var(--acc);color:#fff;margin-top:10px}
.btn.sec{background:#eef0ff;color:#3f3aa8}.btn.danger{background:#fff0f0;color:#b91c1c}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin:10px 0}.field>label{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:5px}
.field>label span{color:var(--acc)}
.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;background:#fff}
.field input[type=range]{width:100%;accent-color:var(--acc)}
.seg{display:grid;gap:4px}.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font-weight:800;font-size:15px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#22243a;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
nav.tabs button i{font-style:normal;font-size:20px;line-height:1.1}nav.tabs button.on{color:var(--acc)}
.dayrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:9px 10px;margin:6px 0;width:100%;text-align:left}
.dayrow.t-str{--c:var(--str)}.dayrow.t-skl{--c:var(--skl)}.dayrow.t-run{--c:var(--run)}.dayrow.t-rest{--c:var(--rest)}
.dayrow.cur{box-shadow:0 0 0 2px var(--acc)}
.dayrow .dn{min-width:44px;text-align:center;font-size:11px;color:var(--muted)}.dayrow .dn b{display:block;font-size:15px;color:var(--ink)}
.dayrow .db{flex:1}.dayrow .dt{font-weight:700;font-size:14px}.dayrow .df{font-size:12px;color:var(--muted)}
.dayrow .ok{font-size:16px}
.bhd{border-radius:14px;padding:10px 12px;margin:14px 0 4px;color:#fff;background:var(--pc)}
.bhd b{font-size:15px}.bhd div{font-size:12px;opacity:.95}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:6px;background:#f3f2fa;color:#5b5f7a;margin-left:4px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ins{list-style:none;margin:0;padding:0}.ins li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.ins li:last-child{border:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.tile b{display:block;font-size:20px}.tile span{font-size:11px;color:var(--muted)}
.list{font-size:14px}.list div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.list button{border:0;background:#fff0f0;color:#b91c1c;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
textarea.out{width:100%;height:120px;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:8px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 6px}
.ex.mini{padding:7px 10px;margin-top:6px}.ex.mini .exname{font-size:14px}.ex.mini .chips{margin-top:2px}.ex.mini .exnote{font-size:12px;margin-top:2px}.ex.mini details.how{margin-top:2px}
body.shot nav.tabs,body.shot .toast{display:none}

<script>window.PLAN={"version":"PDR draft v1","defaults":{"start":"2026-10-22","lastPeriod":"2026-10-02","cycleLen":29,"periodLen":7},"ex":{"mcgill_curlup":{"name":"McGill curl-up","fig":"mcgill_curlup","kind":"reps","targets":"Rectus abdominis and obliques, held still (anti-extension)","cue":"Hands under the small of your back, one knee bent. Brace, then lift <b>head and shoulders as one unit<\/b> about 2–3 cm and hold 8–10 s. Your neck stays still and you breathe behind the brace.","mistakes":["Flattening the low back into the hands","Tucking the chin or yanking the neck"],"easier":"Shorter holds (5 s)","harder":"Lift elbows off the floor during the hold"},"side_plank":{"name":"Side plank","fig":"side_plank","kind":"time","targets":"Obliques, quadratus lumborum, glute med","cue":"Elbow under shoulder. Lift the hips until <b>ear, hip and knee/ankle line up<\/b>. Feel the side of the waist working, not the shoulder.","mistakes":["Hips sagging or piking back","Shoulder shrugging toward the ear"],"easier":"Knees bent, knees on the floor","harder":"Legs straight; top-leg lift"},"bird_dog":{"name":"Bird dog","fig":"bird_dog","kind":"reps","targets":"Spinal stabilisers, glutes, deep abs","cue":"Brace like there is a glass of water on your back. Reach one arm and the opposite leg <b>long, not high<\/b>, hold 5–8 s, and squeeze the glute of the reaching leg.","mistakes":["Arching the low back to lift the leg higher","Hips rotating open"],"easier":"Leg only, then arm only","harder":"Slow 10 s holds; draw small squares"},"dead_bug":{"name":"Dead bug","fig":"dead_bug","kind":"reps","targets":"Deep abs (transverse abdominis), obliques; anti-extension","cue":"Low back stays <b>gently pressed into the floor<\/b>. Exhale fully as you reach the opposite arm and leg away, and move slowly.","mistakes":["Low back lifting off the floor","Rushing or holding your breath"],"easier":"Move the leg only, heel taps","harder":"Hold a light plate or band overhead"},"hollow_hold":{"name":"Hollow body hold","fig":"hollow_hold","kind":"time","targets":"Abs, hip flexors (compression and handstand line)","cue":"Press the low back down, ribs down. Arms by ears, legs long. <b>Raise the legs only as low as you can keep your back glued<\/b>.","mistakes":["Low back arching off the floor","Chin jutting forward"],"easier":"Knees bent (tuck hollow)","harder":"Arms overhead, legs lower, hollow rocks"},"glute_bridge":{"name":"Glute bridge","fig":"glute_bridge","kind":"reps","targets":"Glutes, hamstrings","cue":"Feet flat and hip-width. Drive through the heels, <b>squeeze the glutes 2 s<\/b> at the top, ribs down.","mistakes":["Arching the back at the top","Pushing through the toes"],"easier":"Smaller range","harder":"Single-leg, or a band above the knees"},"hip_airplane":{"name":"Hip airplane (hand on rack)","fig":"hip_airplane","kind":"reps","targets":"Glute med/max and deep hip rotators of the standing leg","cue":"Hinge on one leg. <b>Rotate the pelvis open and closed around the standing hip<\/b>, 3 s each way. The knee stays over the middle of the foot.","mistakes":["Twisting the shoulders instead of the hip","Locking or caving the standing knee"],"easier":"Smaller rotation","harder":"No hand support; 2 s pause when open"},"goblet_squat":{"name":"Goblet squat","fig":"goblet_squat","kind":"load","unit":"lb DB","targets":"Quads, glutes, adductors; upper back and core hold you tall","cue":"Hold the dumbbell at your chest, elbows in. <b>Brace (breathe into the belly and sides), then sit between your hips<\/b>. Knees follow the toes. Feel the front of the thighs and the glutes.","mistakes":["Heels lifting","Knees caving in","Chest collapsing at the bottom"],"easier":"Squat to a box","harder":"3 s lowering, or 2 s pause at the bottom"},"back_squat":{"name":"Back squat (re-introduction)","fig":"back_squat","kind":"load","unit":"lb bar","targets":"Quads, glutes, adductors; core bracing","cue":"Bar on the upper back, hands just outside the shoulders. <b>Big breath into belly and sides, brace, then sit down<\/b>. Push the floor away and keep the brace all the way up.","mistakes":["Losing the brace at the bottom (butt-wink)","Knees caving","Chasing depth past where the back stays neutral"],"easier":"Goblet squat (back-friendly swap)","harder":"Pause squat (later, not in this block)","swap":"If back pain ≥4: go back to <b>goblet squat<\/b> (same sets and reps) or leg press."},"bss":{"name":"Bulgarian split squat","fig":"bss","kind":"load","unit":"lb/hand","targets":"Quads and glutes of the front leg, adductors; balance","cue":"Rear foot on the bench, front foot far enough forward that the <b>front heel stays down<\/b>. Drop the back knee straight down. Lean the torso slightly forward for more glute.","mistakes":["Front heel lifting","Bouncing off the bottom","Back knee crashing into the floor"],"easier":"Split squat with the back foot on the floor; hold a rack","harder":"3 s lowering; heavier DBs","swap":"If the back complains: hold <b>one DB in goblet position<\/b>, or use bodyweight plus a hand on the rack."},"hip_thrust":{"name":"Barbell hip thrust","fig":"hip_thrust","kind":"load","unit":"lb bar","targets":"Glutes (main), hamstrings, adductors","cue":"Shoulder blades on the bench, chin tucked, ribs down. <b>Drive through the heels and finish with the glutes<\/b>, not the back. Hold 1 s. Shins are vertical at the top.","mistakes":["Arching the low back at the top (ribs flare)","Feet too far out (hamstrings cramp) or too close"],"easier":"Glute bridge, or DB hip thrust","harder":"3 s pause at the top; B-stance"},"db_rdl":{"name":"Dumbbell Romanian deadlift","fig":"db_rdl","kind":"load","unit":"lb/hand","targets":"Hamstrings, glutes; spinal erectors hold the spine still","cue":"Soft knees. <b>Push the hips back<\/b> like shutting a car door, and slide the DBs down the thighs. Stop when you feel a strong hamstring stretch, <b>before the back rounds<\/b> (usually mid-shin).","mistakes":["Rounding the low back to reach lower","Turning it into a squat","DBs drifting away from the legs"],"easier":"Shorter range (to the knees); lighter","harder":"2 s pause at the bottom; single-leg RDL","swap":"If back pain ≥4: swap to a <b>hip thrust or glute bridge<\/b> (no forward hinge) or a cable pull-through, light."},"reverse_lunge":{"name":"Dumbbell reverse lunge","fig":"reverse_lunge","kind":"load","unit":"lb/hand","targets":"Glutes and quads of the front leg, adductors","cue":"Step back, drop the back knee and <b>drive up through the front heel<\/b>. Ribs stay stacked over the hips.","mistakes":["Leaning way forward","Front knee caving"],"easier":"Bodyweight with a hand on the rack","harder":"Deficit (front foot on a plate)"},"leg_curl":{"name":"Seated leg curl (machine)","fig":"leg_curl","kind":"load","unit":"lb stack","targets":"Hamstrings (knee flexion)","cue":"Hips pressed into the seat. <b>Curl the heels under<\/b>, squeeze 1 s, and take 3 s on the way back.","mistakes":["Hips lifting off the seat","Letting the stack slam"],"easier":"Lighter, partial range","harder":"Single-leg; slower lowering"},"copenhagen":{"name":"Copenhagen plank, short lever","fig":"copenhagen","kind":"time","targets":"Adductors (inner thigh), obliques","cue":"Top-leg <b>knee<\/b> on the bench, bottom leg hangs. Lift the hips into a straight line and <b>squeeze the inner thigh into the bench<\/b>.","mistakes":["Hips sagging","Rolling forward"],"easier":"Shorter holds; bottom foot lightly on the floor","harder":"Long lever (foot on the bench)"},"db_bench":{"name":"Dumbbell bench press","fig":"db_bench","kind":"load","unit":"lb/hand","targets":"Chest, front delts, triceps","cue":"Shoulder blades <b>squeezed back and down<\/b>, feet planted. Lower the DBs to chest level with elbows about 45° from the body, then press up and slightly in.","mistakes":["Shoulders rolling forward at the top","Elbows flared straight out"],"easier":"Lighter DBs, floor press","harder":"3 s lowering"},"db_shoulder_press":{"name":"Seated dumbbell shoulder press","fig":"db_shoulder_press","kind":"load","unit":"lb/hand","targets":"Delts (front and side), triceps, upper traps","cue":"Back supported, <b>ribs down so the low back doesn’t arch<\/b>. Press up until the biceps are near the ears.","mistakes":["Arching the back to finish the rep","Pressing too far forward"],"easier":"Neutral grip; lighter","harder":"Standing (more core); slower lowering"},"cs_row":{"name":"Chest-supported dumbbell row","fig":"cs_row","kind":"load","unit":"lb/hand","targets":"Lats, mid-back (rhomboids, mid traps), rear delts","cue":"Chest stays on the incline pad (this <b>takes load off the low back<\/b>). Pull the elbows toward the hips and squeeze 1 s.","mistakes":["Lifting the chest off the pad","Shrugging"],"easier":"Lighter; one arm at a time","harder":"Pause 2 s at the top"},"cable_row":{"name":"Seated cable row","fig":"cable_row","kind":"load","unit":"lb stack","targets":"Lats, mid-back, rear delts, biceps","cue":"Sit tall, slight knee bend. <b>Pull the handle to the lower ribs<\/b> and squeeze the shoulder blades. Don’t rock back.","mistakes":["Rocking the torso to move the weight","Shoulders creeping up"],"easier":"Lighter; pause at the front","harder":"2 s squeeze; single-arm"},"lat_pulldown":{"name":"Lat pulldown","fig":"lat_pulldown","kind":"load","unit":"lb stack","targets":"Lats, biceps, lower traps","cue":"Lean back slightly, chest up. <b>Pull the elbows down to your sides<\/b> and bring the bar to the upper chest.","mistakes":["Pulling behind the neck","Yanking with body swing"],"easier":"Lighter; neutral grip","harder":"Slow 3 s return; band-assisted pull-ups"},"incline_db_press":{"name":"Incline dumbbell press","fig":"incline_db_press","kind":"load","unit":"lb/hand","targets":"Upper chest, front delts, triceps","cue":"Bench at about 30°. Shoulders back and down. <b>Press up over the upper chest<\/b>.","mistakes":["Bench too steep (turns into a shoulder press)","Bouncing at the bottom"],"easier":"Lighter DBs","harder":"3 s lowering"},"lateral_raise":{"name":"Dumbbell lateral raise","fig":"lateral_raise","kind":"load","unit":"lb/hand","targets":"Side delts (the “athletic shoulder” look)","cue":"Slight elbow bend. <b>Lead with the elbows to shoulder height<\/b>, no shrug, and lower slowly.","mistakes":["Swinging","Shrugging up to the ears"],"easier":"Cable or lighter DBs","harder":"1 s pause at the top"},"face_pull":{"name":"Cable face pull","fig":"face_pull","kind":"load","unit":"lb stack","targets":"Rear delts, rotator cuff, mid traps (shoulder health for handstands)","cue":"Rope at face height. <b>Pull to the forehead with elbows high<\/b>, and rotate the thumbs back.","mistakes":["Too heavy, turning it into a row","Elbows dropping"],"easier":"Band face pull","harder":"2 s hold"},"push_up":{"name":"Push-up (hands elevated)","fig":"push_up","kind":"reps","targets":"Chest, triceps, serratus; a moving plank","cue":"Body in one straight line. Lower the chest to the bench, then <b>push the bench away<\/b> and finish with the shoulder blades spread.","mistakes":["Hips sagging","Elbows flared to 90°"],"easier":"Higher surface","harder":"Lower surface, then the floor"},"band_pull_apart":{"name":"Band pull-apart","fig":"band_pull_apart","kind":"reps","targets":"Rear delts, mid traps","cue":"Arms straight at shoulder height. <b>Pull the band to your chest by squeezing the shoulder blades<\/b>.","mistakes":["Shrugging","Bending the elbows a lot"],"easier":"Lighter band","harder":"Pause 2 s"},"wall_handstand":{"name":"Chest-to-wall handstand hold","fig":"wall_handstand","kind":"time","targets":"Shoulders (delts), serratus, upper traps, triceps, core","cue":"Walk the feet up the wall and the hands in toward it, only as far as you can stay in control. <b>Push the floor away<\/b> (tall shoulders), ribs in, glutes and legs squeezed. Come down by walking out.","mistakes":["Banana back (ribs out)","Sinking into the shoulders"],"easier":"Pike hold on a box; stop the walk-up at 45–60°","harder":"Hands closer to the wall; shoulder taps; toe pulls off the wall"},"pike_hold_box":{"name":"Pike hold on box","fig":"pike_hold_box","kind":"time","targets":"Shoulders, serratus, core; handstand loading","cue":"Feet on a box, hips stacked over the shoulders. <b>Push the floor away<\/b> and keep the head between the arms.","mistakes":["Shoulders behind the hands","Bent arms"],"easier":"Lower box","harder":"Higher box; lift one leg"},"kickup":{"name":"Kick-up practice (back to wall)","fig":"kickup","kind":"reps","targets":"Shoulders, balance, confidence upside down","cue":"Hands 20–30 cm from the wall, arms locked. <b>Swing the lead leg up with a small, controlled kick<\/b>, follow with the second leg, heels touch the wall softly. Come down the same way.","mistakes":["Kicking too hard and slamming the wall","Bent arms"],"easier":"Half kick-ups (hips over hands only)","harder":"Hold 10–20 s once up"},"tuck_lsit":{"name":"Tuck L-sit (blocks or parallettes)","fig":"tuck_lsit","kind":"time","targets":"Hip flexors and abs (compression), triceps, lower traps","cue":"Arms locked, <b>push down so the shoulders move away from the ears<\/b>, then pull the knees toward the chest until the feet leave the floor.","mistakes":["Shrugged shoulders","Bent elbows"],"easier":"Feet-supported: heels down, hips up","harder":"One leg extended, then both"},"seated_leg_lift":{"name":"Seated leg lifts (compression)","fig":"seated_leg_lift","kind":"reps","targets":"Hip flexors and lower abs (compression strength for L-sit)","cue":"Sit tall, legs straight, hands beside the knees. <b>Lift both heels from the front of the hips<\/b>, hold 1 s, and lower slowly.","mistakes":["Leaning way back","Bending the knees"],"easier":"One leg at a time; hands further forward","harder":"Hands further back; 3 s holds"},"hanging_knee_raise":{"name":"Hanging knee raise","fig":"hanging_knee_raise","kind":"reps","targets":"Lower abs, hip flexors, grip, lats","cue":"Hang, <b>pull the shoulders down first<\/b>, then curl the knees up and the pelvis under. Lower slowly with no swing.","mistakes":["Swinging","Dead hang with shrugged shoulders"],"easier":"Captain’s chair knee raise","harder":"Straight-leg raises"},"cat_cow":{"name":"Cat-cow","fig":"cat_cow","kind":"reps","targets":"Spinal mobility","cue":"Slow with the breath: <b>round up on the exhale, let it drop on the inhale<\/b>. Stay in a pain-free range.","mistakes":["Rushing"],"easier":"Smaller range","harder":"Pause at each end"},"wrist_prep":{"name":"Wrist prep (rocks, circles)","fig":"wrist_prep","kind":"reps","targets":"Wrist flexors and extensors (handstand prep)","cue":"Palms flat, <b>rock gently forward and back<\/b>, then with the fingers turned back. Pain-free only.","mistakes":["Forcing the range"],"easier":"Smaller rocks","harder":"More weight over the hands"},"hip_flexor":{"name":"Half-kneeling hip flexor stretch","fig":"hip_flexor","kind":"time","targets":"Hip flexors of the back leg (often tight with low-back ache)","cue":"<b>Tuck the tailbone and squeeze the back glute<\/b> first, then shift forward a little. Feel the stretch in the front of the back hip.","mistakes":["Arching the back to get deeper"],"easier":"Less forward shift","harder":"Reach the same-side arm overhead"},"hip_9090":{"name":"90/90 hip switches","fig":"hip_9090","kind":"reps","targets":"Hip internal and external rotation","cue":"Sit tall with both knees bent 90°. <b>Rotate the knees side to side<\/b> slowly and use your hands as needed.","mistakes":["Collapsing the chest"],"easier":"Hands behind you","harder":"Hands-free; lean over the front shin"},"pike_stretch":{"name":"Pike stretch with toe lifts","fig":"pike_stretch","kind":"time","targets":"Hamstrings; active flexibility for L-sit","cue":"<b>Hinge from the hips<\/b>, knees straight. Flex the quads and lift the toes every few breaths.","mistakes":["Rounding the back to reach lower"],"easier":"Bend the knees slightly","harder":"Hold light plates to pull forward"},"childs_pose":{"name":"Child’s pose","fig":"childs_pose","kind":"time","targets":"Low back, lats, hips (down-regulation)","cue":"Sit the hips back to the heels, reach forward and <b>breathe into the low back<\/b>.","mistakes":["Forcing the hips down"],"easier":"Pillow under the hips","harder":"Walk the hands to each side"},"incline_walk":{"name":"Incline treadmill walk","fig":"incline_walk","kind":"cardio","targets":"Aerobic base, glutes and calves; steps","cue":"6–10% incline, about 2.8–3.3 mph. <b>Don’t hold the rails.<\/b> At a nasal-breathing pace you can talk in full sentences. About 100–115 steps/min.","mistakes":["Holding the rails (fewer steps, less work)"],"easier":"Lower incline","harder":"Higher incline, same pace"},"run":{"name":"Zone 2 run","fig":"run","kind":"cardio","targets":"Aerobic base (Zone 2)","cue":"Pace about <b>11:30–12:00 min/mile<\/b>: conversational, so you can speak in full sentences. Short, quick, light steps. Slow down on hot or luteal days.","mistakes":["Drifting faster into Zone 3"],"easier":"Run/walk intervals","harder":"Add strides (only on stride days)"},"strides":{"name":"Strides","fig":"run","kind":"reps","targets":"Running economy, leg speed (not fatigue)","cue":"4–6 × 20 s: build to about 85% speed, <b>smooth and relaxed<\/b>, then walk 60–90 s. Not sprints.","mistakes":["Sprinting all-out"],"easier":"4 strides","harder":"6 strides"},"bss_15":{"name":"1.5-rep Bulgarian split squat","fig":"bss","kind":"load","unit":"lb/hand","src":"grapefitt","targets":"Quads and glutes of the front leg (more time under tension at the bottom)","cue":"One rep = <b>all the way down, halfway up, back down, then all the way up<\/b>. Front heel stays down. Use less weight than for regular BSS.","mistakes":["Rushing the half rep","Front heel lifting"],"easier":"Regular BSS","harder":"Pause 1 s at the bottom","swap":"If the back complains: bodyweight plus a hand on the rack."},"bss_ffe":{"name":"Front-foot-elevated (deficit) Bulgarian split squat","fig":"bss","kind":"load","unit":"lb/hand","src":"grapefitt","targets":"Glutes and quads, adductors (longer range at the bottom)","cue":"Front foot on a 5–10 cm plate or step. This gives a <b>deeper range: the back knee drops below the front foot<\/b>. Only go as deep as the hips stay square and the back stays neutral.","mistakes":["Going deeper than your control","Pelvis twisting"],"easier":"Regular BSS (no plate)","harder":"Higher step (max ~10 cm)","swap":"If the back complains: drop the plate and go back to regular BSS, lighter."},"curtsy_lunge":{"name":"Curtsy lunge (step-over)","fig":"reverse_lunge","kind":"reps","src":"movingmountainsmeg","targets":"Glute med, adductors, quads","cue":"Step one leg <b>diagonally behind and across<\/b>, as in a curtsy, and drop the knee. Hips stay square to the front.","mistakes":["Twisting the hips/spine","Front knee caving"],"easier":"Smaller step, hand on rack","harder":"Hold a light DB"},"kickback":{"name":"Single-leg glute kickback","fig":"kickback","kind":"reps","src":"movingmountainsmeg","targets":"Glutes","cue":"Hands on a rack or wall, slight forward lean. <b>Kick the leg back from the hip<\/b>, squeeze the glute, and <b>don’t arch the low back<\/b>.","mistakes":["Arching the back to lift higher"],"easier":"Smaller range","harder":"Ankle weight or cable"},"lateral_jump":{"name":"Lateral jumps (scaled)","fig":"lateral_jump","kind":"reps","src":"movingmountainsmeg","targets":"Glutes, adductors, ankles; ski-style lateral power","cue":"Small side-to-side hops over a line, <b>landing soft and quiet<\/b> with knees over toes. Scale to quick side step-overs if the back is at all cranky.","mistakes":["Big, stiff landings","Knees caving on landing"],"easier":"Side step-overs","harder":"Hold the landing for 1 s (ski stick)"},"lateral_lunge":{"name":"Lateral (deficit) lunge","fig":"lateral_lunge","kind":"reps","src":"movingmountainsmeg","targets":"Adductors, glutes, quads","cue":"Step wide and <b>sit back into one hip<\/b>, other leg long. Deficit = standing foot on a low step. Keep the chest proud and the back neutral.","mistakes":["Rounding the back to go deeper","Knee caving"],"easier":"No deficit, shallower","harder":"Goblet-hold a light DB"},"pogo":{"name":"Pogo hops","fig":"pogo","kind":"reps","src":"letros.fit","targets":"Calves, Achilles, bone loading (impact)","cue":"Small, springy hops off the balls of the feet, <b>stiff ankles, quick quiet contacts<\/b>. Tall posture, ribs down.","mistakes":["Big heavy jumps","Landing on the heels"],"easier":"Double-leg skips in place","harder":"Slightly higher hops (still small)"},"knee_jump":{"name":"Knee jump (bodyweight)","fig":"knee_jump","kind":"reps","src":"seisthename","targets":"Glutes, hip extension power; impact for bone loading","cue":"Tall-kneel on a mat, swing the arms, <b>pop the hips forward<\/b> and land on both feet in a quiet squat. Stand up, reset fully, repeat. Bodyweight only this month (weighted version later if the back is quiet).","mistakes":["Arching the back to get up","Landing with knees caving"],"easier":"Kneel-to-stand without a jump","harder":"Hold a light DB at the chest (later, not this block)"}},"figs":{"mcgill_curlup":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 180\" role=\"img\" aria-label=\"McGill curl-up: hands under low back, one knee bent, lift head and shoulders slightly as one unit, hold 8-10 s\"><title>McGill curl-up: hands under low back, one knee bent, lift head and shoulders slightly as one unit, hold 8-10 s<\/title><line x1=\"5\" y1=\"162\" x2=\"255\" y2=\"162\" stroke=\"#d9dbe4\" stroke-width=\"3\"/><polyline points=\"150.0,152.0 150.0,152.0 171.2,118.1 191.3,150.3 193.2,139.5\" fill=\"none\" stroke=\"#a3a6bd\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"100.5,145.0 100.5,145.0 125.9,154.3 150.7,156.9\" fill=\"none\" stroke=\"#a3a6bd\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"125.2\" cy=\"148.5\" rx=\"20.0\" ry=\"7.0\" transform=\"rotate( ,82 L118,120\" fill=\"none\" stroke=\"#6c63ff\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"118,120 118.5,113.0 123.8,116.1\" fill=\"#6c63ff\"/><text x=\"40\" y=\"177\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#8d91a8\" text-anchor=\"start\">easier: bend knees, knees on floor<\/text><\/svg>","bird_dog":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 180\" role=\"img\" aria-label=\"Bird dog: on all fours, reach one arm and the opposite leg long, hips level\"><title>Bird dog: on all fours, reach one arm and the opposite leg long, hips level<\/title><line x1=\"5\" y1=\"162\" x2=\"255\" y2=\"162\" stroke=\"#d9dbe4\" stroke-width=\"3\"/><polyline points=\"96.0,118.0 96.0,118.0 56.1,115.2 18.2,112.6 20.1,123.4\" fill=\"none\" stroke=\"#a3a6bd\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"144.9,107.6 144.9,107.6 144.0,134.6 144.0,159.6\" fill=\"none\" stroke=\"#a3a6bd\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"118.0\" cy=\"113.3\" rx=\"20.0\" ry=\"7.0\" transform=\"rotate(-12.0 118.0 113.3)\" fill=\"#ff6b5b\" opacity=\"0.55\"/><ellipse cx=\"90.0\" cy=\"118.0\" rx=\"9.0\" ry=\"7.0\" transform=\"rotate(0.0 90.0 118.0)\" fill=\"#ffb347\" opacity=\"0.55\"/><polyline points=\"47.0,158.0 58.0,158.0 96.0,158.0 96.0,118.0 96.0,118.0\" fill=\"none\" stroke=\"#2b2d42\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"96.0,118.0 144.9,107.6\" fill=\"none\" stroke=\"#2b2d42\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"144.9,107.6 144.9,107.6 171.9,107.6 196.9,107.6\" fill=\"none\" stroke=\"#5c6080\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"159.8\" cy=\"105.5\" r=\"10.0\" fill=\"#2b2d42\"/><text x=\"30\" y=\"40\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#6c63ff\" text-anchor=\"start\">hips level,<\/text><text x=\"30\" y=\"52\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#6c63ff\" text-anchor=\"start\">no twisting<\/text><text x=\"190\" y=\"40\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#6c63ff\" text-anchor=\"start\">reach long,<\/text><text x=\"190\" y=\"52\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#6c63ff\" text-anchor=\"start\">not high<\/text><path d=\"M210,62 L226,96\" fill=\"none\" stroke=\"#6c63ff\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"226,96 220.6,91.6 226.1,89.0\" fill=\"#6c63ff\"/><text x=\"8\" y=\"177\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#8d91a8\" text-anchor=\"start\">brace: imagine a glass of water on your back<\/text><\/svg>","dead_bug":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 180\" role=\"img\" aria-label=\"Dead bug: back flat on floor, reach opposite arm and leg away slowly\"><title>Dead bug: back flat on floor, reach opposite arm and leg away slowly<\/title><line x1=\"5\" y1=\"162\" x2=\"255\" y2=\"162\" stroke=\"#d9dbe4\" stroke-width=\"3\"/><polyline points=\"150.0,150.0 150.0,150.0 189.6,144.4 227.4,140.5 238.2,138.6\" fill=\"none\" stroke=\"#a3a6bd\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"100.0,150.0 100.0,150.0 73.8,143.5 49.2,139.1\" fill=\"none\" stroke=\"#a3a6bd\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><ellipse cx=\"125.0\" cy=\"150.0\" rx=\"20.0\" ry=\"7.0\" transform=\"rotate(180.0 125.0 150.0)\" fill=\"#ff6b5b\" opacity=\"0.55\"/><polyline points=\"188.0,121.0 188.0,110.0 150.0,110.0 150.0,150.0 150.0,150.0\" fill=\"none\" stroke=\"#2b2d42\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><pol /* Larisa 30-day plan · PDR draft v1 · single-file PWA. Data stays in localStorage on this device. */
const P = window.PLAN;
const KEY = 'larisa30.pdr1';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PHCOL = {men:'#f43f5e', fol:'#14b8a6', ovu:'#f59e0b', lut:'#8b5cf6'};

// ---------- dates (all ISO yyyy-mm-dd, computed in UTC to avoid DST issues)
const toD = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const toS = t => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => toS(toD(s) + n * 864e5);
const diff = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmt = (s, o = {weekday: 'short', month: 'short', day: 'numeric'}) => new Date(toD(s)).toLocaleDateString('en-US', Object.assign({timeZone: 'UTC'}, o));

// ---------- state
function fresh() { return {v: 1, settings: Object.assign({}, P.defaults), periods: [P.defaults.lastPeriod], logs: {}, weights: []}; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) { const f = fresh(); return Object.assign(f, s, {settings: Object.assign(f.settings, s.settings || {})}); } } catch (e) {}

}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save: storage full?'); } }
const ui = {tab: 'today', date: null, lift: null};

// ---------- plan + cycle helpers
function planDay(date) { const n = diff(S.settings.start, date) + 1; return n >= 1 && n <= P.days.length ? P.days[n - 1] : null; }

function log(date) { return S.logs[date] || (S.logs[date] = {ex: {}}); }

}

// ---------- rule engine
function exHistory(id, before) {

const nextLoad = w => (w % 5 ? Math.ceil(w / 5) * 5 : w + 5);

function recentCheckin(date, days) {

  const back = backC ? +backC.back : null;

  else if (back != null && back >= 4 && isLower(d)) out.push({cls: 'b-warn', t: `Back pain ${back}/10 on ${fmt(backC.date)} → back-friendly swaps`, m: 'Use the orange swap notes: goblet squat instead of back squat, hip thrust/glute bridge instead of RDL, lighter split squats. Skip the plyo block. Keep RPE ≤7.'});

  if (str && cy.phase === 'Menstrual' && (cy.cd === 3 || cy.cd === 4)) out.push({cls: 'b-info', t: `Cycle day ${cy.cd}: usually your hardest day`, m: 'Light version suggested (toggle above the session). Light movement often helps cramps more than full rest.'});

    if (e && m && e <= 2.2 && m <= 2.5) out.push({t: '⚠️ Possible under-fueling', m: 'Energy and mood are both low across your last check-ins. Eat at maintenance for 2–3 days (carbs around training), prioritise sleep, and tell me.'}); }

    if (rate < -1.5) m += 'Faster than planned for a recomp: add 100–150 kcal/day (mostly carbs).'; else if (rate > -0.25 && wk >= 2.5) m += 'Roughly flat after 2.5+ weeks: check logging accuracy first, then consider −100 kcal.'; else m += 'On track (aim ~0.5–1 lb/week).';

function vToday() {

  const rows = [['date', 'plan_day', 'session', 'version', 'cycle_day', 'phase', 'rpe', 'energy', 'mood', 'sleep_h', 'sleep_q', 'soreness', 'cramps', 'back_pain', 'workout_min', 'sauna_min', 'steps', 'period_start', 'body_weight_lb', 'notes']];
  const dates = new Set(Object.keys(S.logs).filter(k => S.logs[k].checkin).concat(S.weights.map(w => w.date)));
  for (const date of [...dates].sort()) { const c = (S.logs[date] && S.logs[date].checkin) || {};
    rows.push([...ctx(date), c.rpe, c.energy, c.mood, c.sleepH, c.sleepQ, c.soreness, c.cramps, c.back, c.minutes, c.sauna, c.steps, S.periods.includes(date) ? 1 : '', wmap[date] != null ? wmap[date] : '', c.notes]); }
  return csv(rows);
}
function csvSets() {
  const rows = [['date', 'plan_day', 'session', 'version', 'cycle_day', 'phase', 'block', 'exercise_id', 'exercise', 'set', 'weight_lb', 'reps_or_sec', 'done', 'lift_rpe', 'rep_lo', 'rep_hi']];
  for (const date of Object.keys(S.logs).sort()) { const lg = S.logs[date];
    for (const k of Object.keys(lg.ex || {})) { const e = lg.ex[k]; const ex = P.ex[e.id] || {name: e.id};
      if (e.done != null && !(e.sets || []).length) rows.push([...ctx(date), k.split('.')[0], e.id, ex.name, '', '', '', e.done ? 1 : 0, '', '', '']);
      (e.sets || []).forEach((s, i) => { if (s) rows.push([...ctx(date), k.split('.')[0], e.id, ex.name, i + 1, s.w, s.r, s.d ? 1 : 0, e.rpe, e.lo, e.hi]); }); } }
  return csv(rows);
}
function importJson(text) {
  const d = JSON.parse(text); const s = d.data || d;
  if (!s || s.v !== 1 || typeof s.logs !== 'object') throw new Error('Not a backup from this app');
  S = Object.assign(fresh(), s, {settings: Object.assign(fresh().settings, s.settings || {})}); save();
}

// ---------- events
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
function exRec(date, key) {
  const lg = log(date); const s = sessionFor(date); const [bi, rest] = key.split('.'); const [ii, id] = rest.split(':');
  const it = s.blocks[+bi].items[+ii];
  return lg.ex[key] || (lg.ex[key] = {id, lo: it.lo, hi: it.hi, n: it.sets, sets: []});
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-tab],.seg button'); if (!t) return;
  if (t.dataset.tab) { ui.tab = t.dataset.tab; render(); return; }
  if (t.parentElement && t.parentElement.dataset.seg) { const on = t.classList.contains('on'); t.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on')); if (!on) t.classList.add('on'); return; }
  const a = t.dataset.act, date = ui.date;
  if (a === 'prev' || a === 'next') { ui.date = addDays(date, a === 'prev' ? -1 : 1); render(); }
  else if (a === 'today') { ui.date = localToday(); render(); }
  else if (a === 'open') { ui.date = t.dataset.d; ui.tab = 'today'; render(); }
  else if (a === 'go-checkin') { ui.tab = 'checkin'; render(); }
  else if (a === 'ck') { const exEl = t.closest('.ex'), k = +t.closest('.set').dataset.set, rec = exRec(date, exEl.dataset.key); const st = rec.sets[k] || (rec.sets[k] = {});
    st.d = !st.d;
    if (st.d) { const row = t.closest('.set'); row.querySelectorAll('input').forEach(inp => { if (inp.value === '' && inp.placeholder) { inp.value = inp.placeholder; st[inp.dataset.f] = +inp.placeholder; } }); }
    t.classList.toggle('on', st.d); save(); const it = sessionFor(date).blocks[+exEl.dataset.key.split('.')[0]].items[+exEl.dataset.key.split('.')[1].split(':')[0]];
    exEl.classList.toggle('done', rec.sets.filter(x => x && x.d).length >= it.sets); }
  else if (a === 'done1') { const exEl = t.closest('.ex'), rec = exRec(date, exEl.dataset.key); rec.done = !rec.done; t.classList.toggle('on', rec.done); exEl.classList.toggle('done', rec.done); save(); }
  else if (a === 'save-ci') saveCheckin();
  else if (a === 'save-w') { const d = $('#wDate').value, lb = parseFloat($('#wLb').value); if (!d || !(lb > 50)) { toast('Enter a date and weight'); return; } S.weights = S.weights.filter(w => w.date !== d).concat([{date: d, lb}]); save(); toast('Weight saved ✓'); render(); }
  else if (a === 'del-w') { S.weights = S.weights.filter(w => w.date !== t.dataset.d); save(); render(); }
  else if (a === 'del-p') { S.periods = S.periods.filter(p => p !== t.dataset.d); save(); render(); }
  else if (a === 'save-set') { const v = n => document.querySelector(`#view [name=${n}]`).value; const st = {start: v('start'), lastPeriod: v('lastPeriod'), cycleLen: +v('cycleLen') || 29, periodLen: +v('periodLen') || 7};
    if (!st.start || !st.lastPeriod) { toast('Dates required'); return; } S.settings = st; if (!S.periods.includes(st.lastPeriod)) S.periods.push(st.lastPeriod); save(); toast('Settings saved ✓'); render(); }
  else if (a === 'exp-json') download(`larisa30_${localToday()}.json`, JSON.stringify({app: 'larisa30', version: P.version, exportedAt: new Date().toISOString(), data: S}, null, 1), 'application/json');
  else if (a === 'exp-csv-ci') download(`larisa30_checkins_${localToday()}.csv`, csvCheckins(), 'text/csv');
  else if (a === 'exp-csv-sets') download(`larisa30_sets_${localToday()}.csv`, csvSets(), 'text/csv');
  else if (a === 'copy-json') { const txt = JSON.stringify({app: 'larisa30', version: P.version, data: S}); $('#out').value = txt; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied ✓'), () => { $('#out').select(); toast('Select-all and copy from the box'); }); }
  else if (a === 'clear') { if (confirm('Delete ALL logged data on this phone? Export first!')) { S = fresh(); save(); toast('Cleared'); render(); } }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.act === 'lite') { log(ui.date).lite = t.checked; save(); render(); return; }
  if (t.id === 'imp' && t.files[0]) { const r = new FileReader(); r.onload = () => { try { importJson(r.result); toast('Imported ✓'); render(); } catch (e) { toast('Import failed: ' + e.message); } }; r.readAsText(t.files[0]); return; }
  if (t.dataset.f === 'rpe') { const exEl = t.closest('.ex'); exRec(ui.date, exEl.dataset.key).rpe = t.value; save(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if ((t.dataset.f === 'w' || t.dataset.f === 'r') && t.closest('.set')) { const exEl = t.closest('.ex'), k = +t.closest('.set').dataset.set, rec = exRec(ui.date, exEl.dataset.key); const st = rec.sets[k] || (rec.sets[k] = {}); st[t.dataset.f] = t.value === '' ? '' : +t.value; save(); }
  if (t.name === 'rpe' && t.type === 'range') { t.dataset.touched = 1; $('#rpeV').textContent = t.value; }
  if (t.name === 'back' && t.type === 'range') { t.dataset.touched = 1; $('#backV').textContent = t.value + '/10'; }
});
function saveCheckin() {
  const f = $('#ci'), g = n => f.querySelector(`[name=${n}]`), segv = n => { const b = f.querySelector(`[data-seg=${n}] .on`); return b ? +b.dataset.v : ''; };
  const num = n => g(n).value === '' ? '' : +g(n).value;
  const c = {rpe: g('rpe').dataset.touched === '1' ? +g('rpe').value : '', energy: segv('energy'), mood: segv('mood'), sleepH: num('sleepH'), sleepQ: g('sleepQ').value === '' ? '' : +g('sleepQ').value,
    soreness: segv('soreness'), cramps: segv('cramps'), back: g('back').dataset.touched === '1' ? +g('back').value : '', minutes: num('minutes'), sauna: num('sauna'), steps: num('steps'), notes: g('notes').value.trim(), savedAt: new Date().toISOString()};
  log(ui.date).checkin = c;
  const date = ui.date, per = g('period').checked;
  if (per && !S.periods.includes(date)) { S.periods.push(date); if (date > S.settings.lastPeriod) S.settings.lastPeriod = date; }
  if (!per && S.periods.includes(date) && date !== P.defaults.lastPeriod) { S.periods = S.periods.filter(p => p !== date); if (S.settings.lastPeriod === date) S.settings.lastPeriod = periodStarts().filter(p => p !== date).pop() || P.defaults.lastPeriod; }
  save(); toast('Check-in saved ✓'); render();
}
// boot
ui.date = (() => { const t = localToday(), s = S.settings.start; return t < s ? s : t; })();
document.body.insertAdjacentHTML('beforeend', `<nav class="tabs">${[['today', '🏋️', 'Today'], ['plan', '🗓️', 'Plan'], ['checkin', '📝', 'Check-in'], ['trends', '📈', 'Trends'], ['settings', '⚙️', 'Settings']].map(([k, i, l]) => `<button data-tab="${k}"><i>${i}</i>${l}</button>`).join('')}</nav><div class="toast" id="toast"></div>`);
render();
window.__app = {get S() { return S; }, csvCheckins, csvSets, cycle, insights};
</script></body></html>
