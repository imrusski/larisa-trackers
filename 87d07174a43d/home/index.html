<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Home">

<title>Home</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3d5a85;font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif}
#bg{position:fixed;inset:-40px;background:linear-gradient(180deg,#2b4a7c 0%,#4c6b98 22%,#7f9bbb 45%,#a9b7c2 58%,#b8ab95 72%,#8a7663 86%,#5a4b40 100%);filter:blur(20px)}
#stage{position:absolute;left:50%;top:0;width:472px;height:1024px;transform-origin:top center}
.app{position:absolute;width:74px;text-decoration:none;color:#fff;text-align:center}
.app img{width:74px;height:74px;display:block;transition:transform .15s}
.app:active img{transform:scale(.9)}
.app span{display:block;font-size:13.5px;margin-top:5px;white-space:nowrap;margin-left:-20px;margin-right:-20px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
#sb{position:absolute;top:0;left:0;right:0;height:60px;color:#fff;font-weight:600}
#time{position:absolute;left:62px;top:20px;font-size:19px}
#sbr{position:absolute;right:42px;top:22px;display:flex;gap:7px;align-items:center}
.bat{background:rgba(255,255,255,.85);color:#333;font-size:12px;border-radius:5px;padding:0 4px;font-weight:700}
.widget{position:absolute;border-radius:24px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#notes{left:250px;top:92px;width:189px;height:191px;background:#1e1e1e;color:#fff}
#notes .hd{background:linear-gradient(#f6c94b,#eebc30);height:50px;display:flex;align-items:center;padding-left:18px;font-size:18px;font-weight:600}
#notes .bd{padding:18px 20px;font-size:15px;line-height:1.4}
#notes .g{color:#9a9a9a}
.wl{position:absolute;color:#fff;font-size:13.5px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.3)}
#clockw{left:33px;top:326px;width:406px;height:192px;background:rgba(30,30,32,.92);display:flex;justify-content:space-around;padding:22px 8px 0}
.cl{width:92px;text-align:center;color:#fff}
.cl canvas{width:86px;height:86px}
.cl b{display:block;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl i{display:block;font-style:normal;color:#9a9a9e;font-size:14px;line-height:1.3}
#search{position:absolute;left:193px;top:868px;width:86px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}
#dock{position:absolute;left:16px;top:893px;width:440px;height:114px;border-radius:38px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#ball{position:absolute;left:0;top:0;width:34px;height:34px;z-index:10;cursor:pointer;will-change:transform}
#body{position:absolute;left:2px;top:2px;width:30px;height:30px;transform:scale(1.133);border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffffff 0%,#f7f5f2 30%,#e4e1ea 62%,#bdb8c8 100%);box-shadow:0 5px 9px rgba(0,0,0,.28),inset -3px -4px 7px rgba(120,110,140,.35),inset 2px 2px 4px rgba(255,255,255,.9)}
#spin{position:absolute;inset:0;border-radius:50%}
#spin:before{content:"";position:absolute;left:5px;top:20px;width:5px;height:2px;border-radius:2px;background:rgba(150,140,170,.35)}
#shine{position:absolute;left:6px;top:4px;width:10px;height:6px;border-radius:50%;background:rgba(255,255,255,.95);filter:blur(1.5px)}
.eye{position:absolute;top:10px;width:5px;height:8px;background:#23202a;border-radius:3px;transition:height .08s,top .08s}
.eye.l{left:8px}.eye.r{left:17px}
.blink .eye{height:2px;top:13px}
#bubble{position:absolute;z-index:11;max-width:210px;background:#fff;color:#111;font-size:14px;line-height:1.3;padding:9px 13px;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s;pointer-events:none}
#bubble.on{opacity:1;transform:scale(1)}
#bubble:after{content:"";position:absolute;left:var(--tx,20px);width:12px;height:12px;background:#fff;transform:rotate(45deg)}
#bubble.below:after{top:-5px}#bubble:not(.below):after{bottom:-5px}
#shadow{position:absolute;width:26px;height:7px;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(2px);z-index:9}

#web{position:absolute;inset:-2px;z-index:8;background:#f2f2f7;display:none;overflow:hidden}
#web.on{display:block}
#wbar{position:absolute;left:0;right:0;top:0;height:96px;padding-top:50px;background:rgba(248,248,250,.96);border-bottom:1px solid #d8d8de;display:flex;align-items:center;gap:10px;padding-left:14px;padding-right:14px;z-index:2}
#wbar button{border:0;background:#e5e5ea;border-radius:16px;height:32px;padding:0 14px;font-size:15px;font-weight:600;color:#007aff}
#wtitle{flex:1;text-align:center;font-weight:600;font-size:16px;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wbox{position:absolute;left:0;top:96px;right:0;bottom:0}
#wbox iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
#wcard{position:absolute;left:36px;right:36px;top:240px;background:#fff;border-radius:26px;padding:28px 24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.12);display:none}
#wcard img{width:84px;height:84px}
#wcard h3{margin:14px 0 6px;font-size:21px}#wcard p{color:#666;font-size:15px;line-height:1.4;margin:0 0 18px}
#wcard a{display:block;background:#007aff;color:#fff;text-decoration:none;border-radius:14px;padding:13px;font-weight:600;font-size:16px;margin-top:10px}
#wcard a.alt{background:#e5e5ea;color:#007aff}

.wing{position:absolute;top:-4px;width:28px;height:28px;z-index:-1;animation:flap var(--fd,1.4s) ease-in-out infinite;filter:drop-shadow(0 1px 1.5px rgba(60,50,110,.28))}
.wing svg{width:100%;height:100%;display:block;overflow:visible}
.wing.l{left:-20px;transform-origin:92% 63%}.wing.l svg{transform:rotate(-12deg);transform-origin:92% 63%}
.wing.r{right:-20px;transform-origin:8% 63%}
.wing.r svg{transform:rotate(12deg);transform-origin:8% 63%}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
#ball{isolation:isolate}
</style></head><body>

function offH(tz){const d=new Date(),a=parts(tz,d),b=parts(Intl.DateTimeFormat().resolvedOptions().timeZone,d);const ua=Date.UTC(a.year,a.month-1,a.day,a.hour,a.minute),ub=Date.UTC(b.year,b.month-1,b.day,b.hour,b.minute);return Math.round((ua-ub)/36e5)}
function dayLbl(tz){const a=parts(tz),b=parts(Intl.DateTimeFormat().resolvedOptions().timeZone);const d=(Date.UTC(a.year,a.month-1,a.day)-Date.UTC(b.year,b.month-1,b.day))/864e5;return d>0?'Tomorrow':d<0?'Yesterday':'Today'}
const cvs=zones.map(([n,tz])=>{const d=document.createElement('div');d.className='cl';d.innerHTML=`<canvas width="172" height="172"></canvas><b>${n}</b><i class="dl"></i><i class="of"></i>`;cw.appendChild(d);return d});
function draw(){zones.forEach(([n,tz],i)=>{const el=cvs[i],c=el.querySelector('canvas').getContext('2d'),t=parts(tz);const night=t.hour<6||t.hour>=18;
 c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,86,86);c.beginPath();c.arc(43,43,42,0,7);c.fillStyle=night?'#1c1c1e':'#fff';c.fill();
 const fg=night?'#fff':'#000';c.fillStyle=fg;c.font='600 11px -apple-system,Helvetica';c.textAlign='center';c.textBaseline='middle';
 for(let h=1;h<=12;h++){const a=h*Math.PI/6;c.fillText(h,43+33*Math.sin(a),43-33*Math.cos(a))}
 const hand=(ang,len,w,col)=>{c.save();c.translate(43,43);c.rotate(ang);c.beginPath();c.moveTo(0,len<0?0:6);c.lineTo(0,-Math.abs(len));c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke();c.restore()};
 const s=t.second,m=t.minute+s/60,h=(t.hour%12)+m/60;
 hand(h*Math.PI/6,20,3.5,fg);hand(m*Math.PI/30,32,3,fg);hand(s*Math.PI/30,36,1,'#f19a38');
 c.beginPath();c.arc(43,43,2.5,0,7);c.fillStyle='#f19a38';c.fill();
 const o=offH(tz);el.querySelector('.dl').textContent=dayLbl(tz);el.querySelector('.of').textContent=(o>=0?'+':'')+o+'HRS';});
 const n=new Date();document.getElementById('time').textContent=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');}
draw();setInterval(draw,1000);

function pick(){if(web){target={k:'web',pts:[[60+Math.random()*352,140+Math.random()*840]]};return}let k;do{k=keys[Math.random()*keys.length|0]}while(k==cur);
 const [tx,ty]=spots[k];// route via horizontal gutter lines (avoid crossing icons)
 const lanes=[313,551,827];const ly=lanes.reduce((a,b)=>Math.abs(b-y)<Math.abs(a-y)?b:a);
 target={k,pts:[[x,ly],[tx,ly],[tx,ty]]}}

let last=performance.now();
function loop(now){const dt=Math.min(50,now-last);last=now;
 if(pause>0){pause-=dt}else{if(!target)pick();const p=target.pts[0];const dx=p[0]-x,dy=p[1]-y,d=Math.hypot(dx,dy),sp=0.09*dt;
  if(d<sp){x=p[0];y=p[1];target.pts.shift();if(!target.pts.length){if(target.k!='web')cur=target.k;else cur2='web';target=null;pause=2500+Math.random()*3500;if(now-lastSay>nextSay){say(pick1(lines(web?'web':cur)));nextSay=10000+Math.random()*10000}}}
  else{x+=dx/d*sp;y+=dy/d*sp;rot+=(dx/d*sp+dy/d*sp*0.4)/20*57.3;}}
 if(now-lastSay>22000&&pause>0){say(pick1(lines(web?'web':cur)));}
 let bounce=Math.abs(Math.sin(now/220))*(pause>0?1:4);
 if(hopT>0){hopT-=dt;bounce+=Math.sin((1-hopT/600)*Math.PI)*40}
 B.style.transform=`translate(${x-17}px,${y-17-bounce}px)`;
 document.getElementById('spin').style.transform=`rotate(${rot}deg)`;
 SH.style.transform=`translate(${x-13}px,${y+12}px) scale(${1-bounce/80})`;
 // bubble placement
 const below=y<260;BU.classList.toggle('below',below);const bw=BU.offsetWidth||150;let bx=Math.max(8,Math.min(464-bw,x-bw/2));
 BU.style.left=bx+'px';BU.style.top=(below?y+24:y-24-BU.offsetHeight-bounce)+'px';BU.style.setProperty('--tx',(x-bx-6)+'px');
 const fd=hopT>0?'.2s':(pause>0?'1.4s':'.45s');if(B._fd!=fd){B._fd=fd;B.style.setProperty('--fd',fd)}
 requestAnimationFrame(loop)}
function pick1(a){return a[Math.random()*a.length|0]}
B.addEventListener('click',e=>{e.stopPropagation();hopT=600;say(pick1([...lines(web?'web':cur),...generic,"Hey! That tickles 😄","Boing!"]))});
